[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lsat-en"
version = "0.1.0"
description = "Layered source-anchored transfer elastic net for binary and censored survival prediction"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  {name = "Wanru Guo", email = "wanru.guo@som.umaryland.edu"},
  {name = "Binbin Wang"},
  {name = "Curtis Tatsuoka"},
]
dependencies = ["numpy>=1.24", "scipy>=1.10", "pandas>=2.0", "scikit-learn>=1.3"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Scientific/Engineering :: Bio-Informatics"]

[project.optional-dependencies]
survival = ["scikit-survival>=0.23"]
dev = ["pytest>=8", "build", "twine"]

[project.urls]
Repository = "https://github.com/wguo3773/LSAT-EN"
Documentation = "https://github.com/wguo3773/LSAT-EN/blob/main/docs/tutorial.md"
Issues = "https://github.com/wguo3773/LSAT-EN/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

